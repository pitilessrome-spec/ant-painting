<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q-Game Partner · 运营中心</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#101522;color:#e7eaf0;margin:0}main{max-width:1100px;margin:auto;padding:32px 18px}h1{color:#e8c785}small,p{color:#aebbd0}section{background:#1b2536;padding:22px;border-radius:14px;margin:16px 0}article{border:1px solid #35445a;padding:18px;border-radius:12px}#games{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}a{color:#e8c785}input,button{font:inherit;padding:10px;border:1px solid #4c5c73;border-radius:7px;margin:4px;background:#111a29;color:white}button{background:#e8c785;color:#182033;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #35445a}#status{white-space:pre-wrap}label{display:block}</style><main><h1>Q-GAME PARTNER</h1><p>全球游戏发行运营中心 · V0.1 候选版</p><section><h2>游戏目录 · 3款</h2><div id="games"></div></section><section><h2>公司管理员 · 用户与代理</h2><p>公司直接授权，无代理费、无下级代理、无投资人招募奖励。未配置独立数据库和管理员密钥时，管理功能不可用。</p><label>管理员访问密钥 <input id="key" type="password" autocomplete="off"></label><button id="load">读取账号</button><div><input id="code" placeholder="账号编号"><input id="name" placeholder="显示名称"><button id="add">建立账号记录</button></div><p id="status">尚未登录。此版本不含用户自助登录、资金交易或真实结算。</p><table><thead><tr><th>编号</th><th>名称</th><th>代理状态</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></section><section><h2>广告收益</h2><p>待接入平台官方结算报表。模拟广告不计收入；当前未获取真实收入数据。</p></section></main><script>
const catalog=[{"id":"ant-canvas","name":"蚂蚁画布 ANT CANVAS","url":"https://pitilessrome-spec.github.io/ant-painting/","telegram":"https://t.me/AntCanvasArtBot/antcanvas","webAds":"AdsGram 接入；结算未核验","wechat":"待适配","douyin":"待适配"},{"id":"boulder-rush","name":"巨石狂潮 Boulder Rush","url":"https://boulder-rush-ten.vercel.app/","webAds":"仅模拟","wechat":"待适配、广告位待申请","douyin":"待适配、广告位待申请"},{"id":"slot-legion","name":"拉杆军团 Slot Legion","url":"https://slot-legion.vercel.app/","webAds":"仅模拟","wechat":"待适配、玩法审核","douyin":"待适配、玩法审核"}];const $=id=>document.getElementById(id);for(const g of catalog){const a=document.createElement('article');const h=document.createElement('h3');h.textContent=g.name;a.append(h);const link=document.createElement('a');link.href=g.url;link.target='_blank';link.rel='noopener';link.textContent='打开网页游戏';a.append(link);for(const t of ['网页广告：'+g.webAds,'微信：'+g.wechat,'抖音：'+g.douyin]){const p=document.createElement('p');p.textContent=t;a.append(p)}$('games').append(a)}
async function req(body){const r=await fetch('/api/admin',{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+$('key').value,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function load(){const d=await req();$('users').replaceChildren();for(const u of d.users){const tr=document.createElement('tr');for(const x of [u.account_code,u.display_name,u.agent?'已授权':'普通账号']){const td=document.createElement('td');td.textContent=x;tr.append(td)}const td=document.createElement('td'),b=document.createElement('button');b.textContent=u.agent?'撤销':'授权代理';b.onclick=()=>run(async()=>{await req({action:'agent',id:String(u.id),active:!u.agent});await load()});td.append(b);tr.append(td);$('users').append(tr)}$('status').textContent='已读取账号（最多200条）'}
async function run(fn){try{await fn()}catch(e){$('status').textContent=e.message}}$('load').onclick=()=>run(load);$('add').onclick=()=>run(async()=>{await req({action:'create',code:$('code').value,name:$('name').value});await load()});
</script></html>
