<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANT CANVAS · Boss art preview</title>
<style>
  :root{--ink:#5b3a2e;--cream:#fff8ea;--paper:#f6ecd6;--leaf:#4f7a3c;--gold:#e9b44c}
  *{box-sizing:border-box}
  body{margin:0;background:#e9dfc6;font-family:"Trebuchet MS","Avenir Next",system-ui,sans-serif;color:var(--ink)}
  .phone{max-width:420px;margin:0 auto;min-height:100vh;background:linear-gradient(#f9f1de,#efe2c3);padding-bottom:24px}
  .stage{position:relative;border-bottom:3px solid #d8c49b}
  .top{position:absolute;inset:10px 12px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .badge{background:rgba(255,248,234,.92);border:2px solid #d7bf8f;border-radius:14px;padding:6px 10px;box-shadow:0 2px 0 #cdb383}
  .badge b{display:block;font-size:15px;letter-spacing:.2px}
  .badge small{font-size:11px;color:#8a6a4f}
  .tier{background:#4f7a3c;color:#fff8ea;border-color:#3e6430;box-shadow:0 2px 0 #2f4d25;font-weight:700;font-size:12px}
  .hud{padding:10px 14px 4px}
  .hp{height:18px;border-radius:10px;background:#e7d6b2;border:2px solid #b89a6c;overflow:hidden;position:relative}
  .hp i{position:absolute;inset:0 38% 0 0;background:linear-gradient(#ff8f7a,#e5483b);border-right:2px solid #b42d2a}
  .hp span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:14px;font-weight:700;color:#fff;text-shadow:0 1px 0 #7a2420}
  .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .chip{font-size:11.5px;padding:4px 9px;border-radius:999px;background:var(--cream);border:1.5px solid #d7bf8f}
  .chip.mech{background:#fff1c2;border-color:#e9b44c;font-weight:700}
  .board{margin:10px 12px 0;padding:10px;border-radius:18px;background:#fbf3e2;border:2px solid #d7bf8f;display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
  .tile{aspect-ratio:1;border-radius:9px;border:2px solid rgba(91,58,46,.35);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),inset 0 3px 0 rgba(255,255,255,.45);position:relative}
  .c0{background:#f7a8c0}.c1{background:#9fd2f2}.c2{background:#ffd56b}.c3{background:#a6dc8a}
  .tile.spot::after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(#4a4256,#231f2c);box-shadow:0 0 0 3px rgba(255,214,74,.9),0 0 10px 4px rgba(255,200,60,.8)}
  .tile.bud::after{content:"🌷";position:absolute;inset:0;display:grid;place-items:center;font-size:16px;filter:saturate(.6)}
  .picks{display:flex;gap:10px;justify-content:center;margin:12px 0 0}
  .pick{width:58px;height:46px;border-radius:14px;border:2px solid rgba(91,58,46,.45);box-shadow:0 3px 0 rgba(91,58,46,.35);font-weight:700;color:#5b3a2e;font-size:11px}
  .pick.weak{outline:3px solid #e9b44c;outline-offset:2px}
  .tip{margin:10px 14px 0;font-size:12px;color:#7a5b45;text-align:center}
  .controls{display:flex;gap:8px;justify-content:center;margin-top:12px}
  .controls button{font:inherit;font-size:12px;padding:6px 10px;border-radius:10px;border:2px solid #b89a6c;background:var(--cream);color:var(--ink)}
</style>
</head>
<body>
<div class="phone">
  <div class="stage">
    <div id="boss"></div>
    <div class="top">
      <div class="badge"><b>Giant Ladybug</b><small>Storybook Garden · Flower Path</small></div>
      <div class="badge tier">SMALL RAID</div>
    </div>
  </div>
  <div class="hud">
    <div class="hp"><i></i><span>906 / 1450 HP · Phase 2</span></div>
    <div class="row">
      <span class="chip mech">✨ Spots: clear glowing tiles for ×2 damage</span>
      <span class="chip">Weak: Gold</span><span class="chip">Ward 1</span><span class="chip">Turns 41</span>
    </div>
  </div>
  <div class="board" id="board"></div>
  <div class="picks">
    <button class="pick c0">Pink</button><button class="pick c1">Blue</button><button class="pick c2 weak">Gold</button><button class="pick c3">Green</button>
  </div>
  <p class="tip">Spots rot into buds after 2 counterattacks — buds deal no damage.</p>
  <div class="controls"><button id="hit">Hit</button><button id="attack">Boss attacks</button><button id="phase">Phase 3</button><button id="defeat">Defeat</button></div>
</div>
<script src="js/boss-art.js"></script>
<script>
  const art = AntBossArt.mount(document.getElementById('boss'), 'beetle:small', { phase: 2 });
  art.mark('spot', true, 3);
  const rows = [[2,0,1,3,2,0,1,2],[0,3,2,1,0,2,3,1],[1,2,0,2,3,1,0,3],[3,1,3,0,1,3,2,0],[2,0,1,2,0,1,3,2]];
  const spots = new Set(['0,0','0,4','1,6']), buds = new Set(['2,2']);
  document.getElementById('board').innerHTML = rows.slice().reverse().map((r, ri) => r.map((c, ci) => {
    const k = (rows.length - 1 - ri) + ',' + ci;
    return `<div class="tile c${c}${spots.has(k) ? ' spot' : ''}${buds.has(k) ? ' bud' : ''}"></div>`;
  }).join('')).join('');
  document.getElementById('hit').onclick = () => art.hit();
  document.getElementById('attack').onclick = () => art.attack();
  document.getElementById('phase').onclick = () => art.setPhase(3);
  document.getElementById('defeat').onclick = () => art.defeat();
</script>
</body>
</html>
