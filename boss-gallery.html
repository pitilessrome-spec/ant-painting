<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANT CANVAS · Boss gallery</title>
<style>
  body{margin:0;background:#e9dfc6;font-family:"Trebuchet MS","Avenir Next",system-ui,sans-serif;color:#5b3a2e}
  h1{font-size:18px;margin:14px 16px 4px}p{margin:0 16px 10px;font-size:12px;color:#7a5b45}
  .world{margin:10px 12px 18px}.world h2{font-size:15px;margin:0 4px 6px}
  .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  figure{margin:0;background:#fff8ea;border:2px solid #d7bf8f;border-radius:14px;overflow:hidden}
  figcaption{font-size:12px;padding:6px 10px;display:flex;justify-content:space-between}
  figcaption b{font-size:13px}
</style></head><body>
<h1>ANT CANVAS · 12 raid bosses</h1><p>Hand-drawn SVG in the world-map style. Add <code>?mark=1</code> to show each boss's mechanic overlay, <code>?phase=3</code> for enraged.</p>
<div id="worlds"></div>
<script src="js/boss-art.js"></script>
<script src="js/boss-art-garden.js"></script>
<script src="js/boss-art-forest.js"></script>
<script src="js/boss-art-coral.js"></script>
<script src="js/boss-art-snow.js"></script>
<script>
  const q = new URLSearchParams(location.search), phase = +(q.get('phase') || 1), only = q.get('world');
  const WORLDS = [['beetle', 'Storybook Garden'], ['spider', 'Mushroom Forest'], ['prism', 'Coral Island'], ['frost', 'Snowlight Valley']];
  const MARK = { 'beetle:small': ['spot', 3], 'beetle:medium': ['thorns'], 'beetle:world': ['ball'], 'spider:small': ['split'], 'spider:medium': ['hidden'], 'spider:world': ['eggs', 3],
    'prism:small': ['shell'], 'prism:medium': ['tide'], 'prism:world': ['stun'], 'frost:small': ['sting'], 'frost:medium': ['crystals', [true, false, true]], 'frost:world': ['aurora', 4] };
  const host = document.getElementById('worlds');
  for (const [w, name] of WORLDS) {
    if (only && only !== w) continue;
    const sec = document.createElement('section'); sec.className = 'world'; sec.innerHTML = `<h2>${name}</h2><div class="row"></div>`; host.appendChild(sec);
    for (const tier of ['small', 'medium', 'world']) {
      const key = w + ':' + tier, def = AntBossArt.get(key);
      const fig = document.createElement('figure'); fig.innerHTML = `<div></div><figcaption><b>${def ? def.name : key}</b><span>${tier}</span></figcaption>`;
      sec.querySelector('.row').appendChild(fig);
      const art = AntBossArt.mount(fig.firstElementChild, key, { phase });
      if (art && q.get('mark')) art.mark(...[MARK[key][0], true, MARK[key][1]]);
    }
  }
</script></body></html>
