<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Q-GAME 用户中心</title><style>*{box-sizing:border-box}body{background:#101722;color:#e7eef5;font:15px system-ui;margin:0}main{max-width:950px;margin:auto;padding:25px 18px}h1{color:#e4c47e}section,article{background:#1c2838;padding:20px;border:1px solid #344357;border-radius:14px;margin:12px 0}#games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,button{font:inherit;padding:11px;margin:5px;border-radius:8px;border:1px solid #536476}input{background:#101722;color:white}button{background:#d9bd7d;color:#152233;cursor:pointer}button:disabled{opacity:.5}a{color:#dfc785}small,p{color:#b2c1d3}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:10px;border-bottom:1px solid #344357}[hidden]{display:none!important}</style><main><h1>Q-GAME · 游戏合作用户中心</h1><section id="login"><h2>账号登录</h2><form id="form"><input id="code" required placeholder="公司分配的账号编号" autocomplete="username"><input type="password" id="password" required placeholder="密码" autocomplete="current-password"><button>登录</button></form><p id="login-status" role="status"></p></section><div id="home" hidden><section><button id="logout" style="float:right">退出</button><h2 id="welcome"></h2><p>游戏授权及运营服务申请测试版。报价为意向价格，不构成已支付订单、收益权或投资承诺。</p></section><section><h2>游戏项目</h2><div id="games"></div></section><section><h2>我的申请</h2><p>提交申请后由公司人工审查，正式授权范围以双方合同为准。当前不接收款项，也不自动产生任何广告分润。</p><p id="status" role="status"></p><div style="overflow:auto"><table><thead><tr><th>游戏</th><th>参考报价</th><th>申请状态</th></tr></thead><tbody id="orders"></tbody></table></div></section><section><h2>广告收益与运营报告</h2><p>当前无已生效合同及个人收益报表。不会把模拟广告计入真实收入。</p></section></div></main><script>
const API='https://ant-canvas-telegram-api.vercel.app/api/',$=id=>document.getElementById(id);let token='',epoch=0,busy=false;async function req(path,body,auth=token){const r=await fetch(API+path,{method:body?'POST':'GET',headers:{...(auth?{Authorization:'Bearer '+auth}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'omit'});const d=await r.json();if(!r.ok){const e=Error(d.error||'请求失败');e.status=r.status;throw e}return d}
function clear(){epoch++;token='';$('home').hidden=true;$('login').hidden=false;$('games').replaceChildren();$('orders').replaceChildren();$('welcome').textContent='';$('status').textContent='';$('password').value=''}
function render(d){$('games').replaceChildren();$('orders').replaceChildren();const names=Object.fromEntries(d.catalog.map(g=>[g.id,g.name]));for(const g of d.catalog){const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),l=document.createElement('a'),b=document.createElement('button');h.textContent=g.name;p.textContent='参考授权及运营服务报价：¥'+g.quoteFen/100;l.href=g.url;l.target='_blank';l.rel='noopener';l.textContent='试玩游戏';b.textContent='提交合作申请（不付款）';b.disabled=d.orders.some(o=>o.game_id===g.id&&o.status!=='cancelled');b.onclick=()=>load({id:crypto.randomUUID(),gameId:g.id});a.append(h,p,l,b);$('games').append(a)}for(const o of d.orders){const tr=document.createElement('tr');for(const v of [names[o.game_id],(o.quote_fen/100).toFixed(2),({draft:'待审查',reviewed:'已审查，未生效',cancelled:'已取消'})[o.status]]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('orders').append(tr)}}
async function load(body){if(busy||!token)return;busy=true;const run=epoch;try{const d=await req('partner/orders',body);if(run===epoch&&token){render(d);$('status').textContent=body?'申请已提交，未收款':'已读取申请'}}catch(e){if(run===epoch){if(e.status===401){clear();$('login-status').textContent=e.message}else $('status').textContent=e.message}}finally{busy=false}}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const run=epoch,password=$('password').value;$('password').value='';try{const d=await req('partner/login',{code:$('code').value,password},'');if(run!==epoch)return;token=d.token;$('welcome').textContent='欢迎，'+d.displayName;$('login').hidden=true;$('home').hidden=false;$('login-status').textContent='';busy=false;await load()}catch(e){if(run===epoch)$('login-status').textContent=e.message}finally{busy=false}};
$('logout').onclick=()=>{const t=token;clear();if(t)req('partner/logout',{},t).catch(()=>{})};
</script></html>
