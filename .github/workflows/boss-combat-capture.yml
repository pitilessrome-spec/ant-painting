name: V5.1.3 actual boss browser acceptance
on:
  push:
    branches: [qa/boss-combat-v513]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/v513-boss.test.cjs tools/v507-tactics.test.cjs tools/v511-skills.test.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install chromium --with-deps
      - run: |
          python3 -m http.server 8765 > /tmp/ant-server.log 2>&1 &
          node tools/boss-combat-capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-boss-combat-screenshots
          path: screenshots/*.png
          if-no-files-found: error
