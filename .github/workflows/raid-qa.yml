name: Raid authoritative PostgreSQL QA
on:
  push:
    branches: [feat/raid-authority-v01]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: raid
          POSTGRES_PASSWORD: raid_test_only
          POSTGRES_DB: raid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raid -d raid_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAID_TEST_DATABASE_URL: postgres://raid:raid_test_only@127.0.0.1:5432/raid_test
    defaults:
      run:
        working-directory: telegram-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: node --test tests/*.test.js
      - run: node --check ../js/raid.js && node --check ../js/raid-announcements.js && node --check ../js/home.js
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install chromium --with-deps
      - run: node tests/raid-browser.cjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: raid-mobile-browser-screenshots
          path: screenshots/*.png
