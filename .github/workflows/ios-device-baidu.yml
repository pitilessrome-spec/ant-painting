name: ANT CANVAS iOS dual SDK device build
on:
  push:
    branches: ['ios/ant-canvas-v01']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: xcodebuild -version && pod --version
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Generate dual-SDK native project (test IDs)
        env:
          ANT_BAIDU_NATIVE: '1'
        run: npm run ios:add && npm run ios:sync
      - name: Verify CocoaPods sandbox
        working-directory: ios-app/ios/App
        run: |
          pod install
          test -f Podfile.lock
          test -f Pods/Manifest.lock
          diff -u Podfile.lock Pods/Manifest.lock
          ruby ../../scripts/integrate-baidu.rb
          find Pods -name BaiduMobAdRewardVideo.h -print
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -destination 'generic/platform=iOS' -showBuildSettings > "$RUNNER_TEMP/ant-settings.txt"
          grep -E 'FRAMEWORK_SEARCH_PATHS =|HEADER_SEARCH_PATHS =|OTHER_LDFLAGS =' "$RUNNER_TEMP/ant-settings.txt" | head -15
          grep -q 'BaiduMobAdSDK' "$RUNNER_TEMP/ant-settings.txt"
      - name: Compile unsigned iPhone device app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ant-device" CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/ant-device/Build/Products/Debug-iphoneos/App.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/ant-device/Build/Products/Debug-iphoneos/App.app" "$RUNNER_TEMP/ANT-CANVAS-iOS-V0.4-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ANT-CANVAS-iOS-V0.4-unsigned
          path: ${{ runner.temp }}/ANT-CANVAS-iOS-V0.4-unsigned.zip
          if-no-files-found: error
