name: V8 siege isolated acceptance
on:
  push:
    branches: [feat/v8-ant-siege-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  siege:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: raid
          POSTGRES_PASSWORD: raid_test_only
          POSTGRES_DB: raid_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U raid -d raid_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAID_TEST_DATABASE_URL: postgres://raid:raid_test_only@127.0.0.1:5432/raid_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
        working-directory: telegram-backend
      - run: node --test --test-concurrency=1 tests/siege-*.test.js
        working-directory: telegram-backend
